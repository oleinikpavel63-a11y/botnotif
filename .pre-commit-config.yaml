# Pre-commit hooks. Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(apps/backend|apps/player-agent|packages)/
      - id: ruff-format
        files: ^(apps/backend|apps/player-agent|packages)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend + agent)
        entry: .venv/bin/python -m mypy --config-file mypy.ini
        language: system
        pass_filenames: false
        files: ^(apps/backend/app|apps/player-agent/agent|packages)/.*\.py$
        args: ["apps/backend/app", "apps/player-agent/agent", "packages/shared-contracts/python/lw_contracts"]
