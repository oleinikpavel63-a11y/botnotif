# Reverse proxy + Mini App static hosting (FULL mode).
# Terminate TLS at a load balancer or add certs here for WSS/HTTPS.

upstream lw_backend {
    server backend:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 60m;  # allow audio uploads

    # Mini App SPA.
    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # REST API.
    location /api/ {
        proxy_pass http://lw_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Telegram webhook.
    location /telegram/ {
        proxy_pass http://lw_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Player Agent WebSocket (WSS when TLS terminates upstream).
    location /ws/ {
        proxy_pass http://lw_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;  # long-lived agent connections
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://lw_backend/health;
    }
}
