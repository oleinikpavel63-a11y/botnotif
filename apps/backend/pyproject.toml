[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lw-backend"
version = "1.0.0"
description = "Living Water Audio Control — backend API + Telegram bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiogram>=3.4",
    "sqlalchemy[asyncio]>=2.0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "APScheduler>=3.10",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "mutagen>=1.47",
    "tzdata>=2024.1",
    "lw-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "asgi-lifespan>=2.1",
]

[project.scripts]
lw-backend = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
