[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lw-player-agent"
version = "1.0.0"
description = "Living Water Audio Control — Player Agent (mpv controller)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "lw-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
lw-agent = "agent.main:run"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
